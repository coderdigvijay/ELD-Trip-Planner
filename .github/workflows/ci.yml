name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: HYPOTHESIS_PROFILE=ci uv run pytest -q --tb=short
      - name: OpenAPI schema drift
        run: |
          DJANGO_DEBUG=true uv run python manage.py spectacular --format openapi-json --file /tmp/openapi.json
          diff /tmp/openapi.json openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: npm test
      - name: API type drift
        run: |
          npx openapi-typescript ../backend/openapi.json -o /tmp/api-types.ts
          diff /tmp/api-types.ts src/services/api-types.ts
      - run: npm run build && npm run check:bundle

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Playwright (headed under xvfb, ORS mocked)
        run: cd frontend && xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
