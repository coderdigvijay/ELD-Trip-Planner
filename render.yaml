# Render blueprint (repo root). No secrets in this file (docs/DEPLOYMENT.md section 2).
services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-dev gunicorn -c gunicorn.conf.py config.wsgi
    healthCheckPath: /api/v1/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ORS_API_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NUM_PROXIES
        value: "1"
